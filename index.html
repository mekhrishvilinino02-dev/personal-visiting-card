<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ნინო მეხრიშვილი - სავიზიტო ბარათი</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome აიქონებისთვის -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="card-container">
        <div class="card">
            <!-- ავატარი / ფოტო -->
            <div class="avatar-container">
                <img src="https://via.placeholder.com/150" alt="ნინო მეხრიშვილის ფოტო" class="avatar">
            </div>

            <!-- ზოგადი ინფორმაცია -->
            <div class="card-info">
                <h1>ნინო მეხრიშვილი</h1>
                <p class="role">Frontend Developer & Student</p>
                <p class="bio">ვეუფლები ვებ-დეველოპმენტს და ვცდილობ შევქმნა თანამედროვე, სუფთა და მომხმარებელზე მორგებული ციფრული პროდუქტები.</p>
            </div>

            <!-- სოციალური ქსელები / ბმულები -->
            <div class="social-links">
                <a href="https://github.com/nino-username" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="mailto:example@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </main>

</body>
</html>
